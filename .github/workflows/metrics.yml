name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: DinethShakya23
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Colombo
          plugin_languages: yes
          extras_css: |
            .items-wrapper > section:nth-child(1) > .row > section:nth-child(1) > .field:nth-child(2),
            .items-wrapper > section:nth-child(2) > .row > section:nth-child(1) > .field:nth-child(3),
            .items-wrapper > section:nth-child(2) > .row > section:nth-child(2) > .field:nth-child(2),
            .items-wrapper > section:nth-child(2) > .row > section:nth-child(2) > .field:nth-child(3),
            .items-wrapper > section:nth-child(2) > .row > section:nth-child(2) > .field:nth-child(4),
            .items-wrapper > section:nth-child(3) > .row > section > .row > section:nth-child(1) > .field:nth-child(n+2),
            .items-wrapper > section:nth-child(3) > .row > section > .row > section:nth-child(2) > .field:nth-child(1) { display: none; }
            .items-wrapper > section:nth-child(3) > .row > section > .row { display: grid; grid-template-columns: 1fr 1fr; }
            .items-wrapper > section:nth-child(3) > .row > section > .row > section { display: contents; }
